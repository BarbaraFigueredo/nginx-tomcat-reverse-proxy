services:
  tomcat1:
    image: tomcat:9.0-jdk17
    volumes:
      - ./JavaWeb1/dist/ROOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
  tomcat2:
    image: tomcat:9.0-jdk17
    volumes:
      - ./JavaWeb1/dist/ROOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
  nginx:
    image: nginx:stable
    ports:
      - "9090:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tomcat1
      - tomcat2
