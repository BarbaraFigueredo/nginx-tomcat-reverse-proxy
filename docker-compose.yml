services:
  tomcat1:
    image: tomcat:9.0-jdk17
    volumes:
      - ./JavaWeb1/dist/ROOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
  tomcat2:
    image: tomcat:9.0-jdk17
    volumes:
      - ./JavaWeb1/dist/ROOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
  nginx:
    image: nginx:stable
    ports:
      - "9090:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tomcat1
      - tomcat2

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: --nginx.scrape-uri=http://nginx/stub_status
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nginx-exporter

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
